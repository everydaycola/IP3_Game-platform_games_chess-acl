spring.application.name=chess-acl
server.port=8083
chessGameUrl.url=http://localhost:8080/api

 # no db yet
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true

spring.datasource.url=jdbc:postgresql://localhost:5443/postgres?currentSchema=chessacl
spring.datasource.username=user
spring.datasource.password=password

#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.data-locations=classpath:sql/data.sql

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/FourteenGames
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/FourteenGames/protocol/openid-connect/certs

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

spring.rabbitmq.fourteengames.exchange-name=xivgames_exchange
spring.rabbitmq.fourteengames.register-game-binding=game.register
spring.rabbitmq.fourteengames.register-game-queue=register_game
spring.rabbitmq.fourteengames.unlock-achievement-binding=achievement.unlock

spring.rabbitmq.fourteengames.exchange-name-chess=gameExchange
spring.rabbitmq.fourteengames.register-game-binding-chess=game.registered
spring.rabbitmq.fourteengames.register-game-queue-chess=register_game_chess
spring.rabbitmq.fourteengames.unlock-achievement-binding-chess=achievement.acquired
spring.rabbitmq.fourteengames.unlock-achievement-queue-chess=unlock_achievement_chess
spring.rabbitmq.fourteengames.game-created-binding-chess=game.created
spring.rabbitmq.fourteengames.game-created-queue-chess=game_created_chess
spring.rabbitmq.fourteengames.game-ended-binding-chess=game.ended
spring.rabbitmq.fourteengames.game-ended-queue-chess=game_ended_chess

spring.rabbitmq.fourteengames.analytics-exchange=platform.events
spring.rabbitmq.fourteengames.analytics-game-started-binding=game.session.started
spring.rabbitmq.fourteengames.analytics-game-ended-binding=game.session.ended
spring.rabbitmq.fourteengames.analytics-game-abandoned-binding=game.session.abandoned
spring.rabbitmq.fourteengames.analytics-session-started-binding=game.session.started
spring.rabbitmq.fourteengames.analytics-winner-declared-binding=game.winner.declared
spring.rabbitmq.fourteengames.analytics-achievement-unlocked-binding=game.achievement.unlocked

spring.game.register.internal-url=http://localhost:3333/game/00000000-0000-0000-0000-000000000001
spring.game.register.external-url=http://localhost:3333/game/00000000-0000-0000-0000-000000000001
spring.game.register.register-id=00000000-0000-0000-0000-000000000001
spring.game.register.ai-start-game-endpoint=http://localhost:8083/chess-acl/api/matches
spring.game.register.start-game-endpoint=http://localhost:8083/chess-acl/api/matches

spring.game.register.name=Chess
spring.game.register.description=A classic game of strategy and skill.
spring.game.register.price=4.99
spring.game.register.genres=Strategy

cors.allowed-origins=http://localhost:5173